services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster
      POSTGRES_DB: disaster_prep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster -d disaster_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://disaster:disaster@db:5432/disaster_prep
      # Left empty on purpose: entrypoint.sh generates a real key on first run
      # and persists it in the api_secret volume. Set it here (or in a .env
      # file) to supply your own, e.g. for CI.
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: '["*"]'
      # Fills an empty database with the demo accounts and sample data so a
      # fresh `docker compose up` is log-in-able. Set to false for anything
      # resembling a real deployment.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_secret:/run/secrets
    expose:
      - "8000"
    # For local convenience also map the port so /docs is visible:
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  api_secret: